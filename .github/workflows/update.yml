name: Automated IPTV Playlist Sync (NaiveProxy)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync_and_convert:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python Proxy Dependencies
      run: |
        pip install PySocks sockshandler

    - name: Install and Run NaiveProxy Client
      env:
        NAIVE_NODE_URL: ${{ secrets.NAIVE_NODE_URL }}
      run: |
        # 1. 下载适用于 Linux x86_64 的 NaiveProxy 客户端 (使用较新稳定版本)
        NAIVE_VERSION="v122.0.6261.94-1"
        curl -L -o naiveproxy.tar.xz https://github.com{NAIVE_VERSION}/naiveproxy-${NAIVE_VERSION}-openwrt-x86_64.tar.xz || \
        curl -L -o naiveproxy.tar.xz https://github.com
        
        tar -xf naiveproxy.tar.xz
        cd naiveproxy-*
        
        # 2. 动态生成 NaiveProxy 配置文件
        cat <<EOF > config.json
        {
          "listen": "socks://127.0.0.1:1080",
          "proxy": "${NAIVE_NODE_URL}"
        }
        EOF
        
        # 3. 在后台启动 NaiveProxy 并等待其就绪
        ./naive config.json > /dev/null 2>&1 &
        echo "正在等待 NaiveProxy 本地隧道建立..."
        sleep 5
        
        # 测试本地 SOCKS5 是否畅通
        curl --socks5-hostname 127.0.0.1:1080 https://google.com -I || echo "警告：本地隧道测试失败，尝试继续执行脚本"

    - name: Run Conversion Script
      env:
        SOURCE_M3U_URL: ${{ secrets.SOURCE_M3U_URL }}
        TARGET_PROXY_DOMAIN: ${{ secrets.TARGET_PROXY_DOMAIN }}
      run: python convert.py

    - name: Commit and Push to Repository
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        if [ -f "live.m3u" ]; then
          git add live.m3u
          git commit -m "自动更新：通过日本 Naive 节点无缝抓取并同步" || echo "列表无变化，无需更新"
          git push
        fi
