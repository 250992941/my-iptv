name: Automated IPTV Playlist Sync (Pure Python)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write # 显式声明赋予工作流写入仓库代码的权限

jobs:
  sync_and_convert:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        persist-credentials: true # 允许保留凭证用于后续的 git push

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Direct Conversion Script
      env:
        SOURCE_M3U_URL: ${{ secrets.SOURCE_M3U_URL }}
        TARGET_PROXY_DOMAIN: ${{ secrets.TARGET_PROXY_DOMAIN }}
        NAIVE_NODE_URL: ${{ secrets.NAIVE_NODE_URL }}
      run: python convert.py

    # 【核心修复】强制将本地生成的 live.m3u 文件推送到你的代码仓库主分支中
    - name: Commit and Force Push M3U to Repository
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        
        # 显式检查文件是否存在
        if [ -f "live.m3u" ]; then
          echo "文件生成成功，正在准备提交..."
          git add live.m3u
          
          # 即使列表没有变化，也强制提交以更新时间戳，确保国内直连拿到的永远是最新的
          git commit -m "自动同步：已将通过日本 Naive 节点洗净的最新直播源写入仓库" --allow-empty
          
          # 推送到当前分支（通常是 main 或 master）
          git push origin HEAD:${{ github.ref_name }}
          echo "成功！最新文件已安全写入您的代码仓库主页。"
        else
          echo "错误：脚本未能正确生成 live.m3u 文件"
          exit 1
        fi
