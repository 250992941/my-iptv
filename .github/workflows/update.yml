name: Automated IPTV Playlist Sync (Pure HTTPS Proxy)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync_and_convert:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Direct HTTPS Proxy Conversion Script
      run: python convert.py

    - name: Commit and Force Push M3U to Repository
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        
        if [ -f "live.m3u" ]; then
          git add live.m3u
          git commit -m "自动同步：已成功通过德国安全隧道同步静态 M3U 列表" --allow-empty
          git push origin HEAD:${{ github.ref_name }}
          echo "最新播放列表已成功发布在您的仓库主页。"
        else
          echo "错误：未能检测到 live.m3u 文件"
          exit 1
        fi

