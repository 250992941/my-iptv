name: Automated IPTV Playlist Sync (Pure Static Gate)

on:
  workflow_dispatch: # 支持随时手动触发点击生成文件

permissions:
  contents: write # 给予代码仓库写入权限

jobs:
  sync_and_convert:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Static Rewrite Logic
      run: python convert.py

    - name: Commit and Force Push M3U to Repository
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        
        if [ -f "live.m3u" ]; then
          git add live.m3u
          git commit -m "自动同步：免服务器公共网关版 M3U 已成功写入仓库" --allow-empty
          git push origin HEAD:${{ github.ref_name }}
          echo "恭喜！最新播放列表已成功发布在您的仓库主页。"
        else
          echo "错误：未能成功物理生成 live.m3u 文件"
          exit 1
        fi
