name: Automated IPTV Playlist Sync (Pure Python)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync_and_convert:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Direct Conversion Script
      env:
        SOURCE_M3U_URL: ${{ secrets.SOURCE_M3U_URL }}
        TARGET_PROXY_DOMAIN: ${{ secrets.TARGET_PROXY_DOMAIN }}
        NAIVE_NODE_URL: ${{ secrets.NAIVE_NODE_URL }}
      run: python convert.py

    - name: Commit and Push to Repository
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        if [ -f "live.m3u" ]; then
          git add live.m3u
          git commit -m "自动更新：纯Python无缝握手同步完成" || echo "列表无变化，无需更新"
          git push
        fi
