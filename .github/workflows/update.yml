name: Automated IPTV Playlist Sync (Pure Local Static)

on:
  workflow_dispatch: # 允许你随时手动在后台点击按钮瞬间生成并更新文件

permissions:
  contents: write # 给予写入权限

jobs:
  sync_and_convert:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Clean Rewrite Logic
      run: python convert.py

    - name: Commit and Force Push M3U to Repository
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        
        if [ -f "live.m3u" ]; then
          git add live.m3u
          git commit -m "自动同步：静态注入版 M3U 直播源已成功写入仓库" --allow-empty
          git push origin HEAD:${{ github.ref_name }}
          echo "恭喜！最新文件已成功呈现在您的仓库主页。"
        else
          echo "错误：未能生成文件"
          exit 1
        fi
