name: Automated IPTV Playlist Sync (Pure Static)

on:
  workflow_dispatch: # 静态版主要通过手动点击来生成更新文件

permissions:
  contents: write

jobs:
  sync_and_convert:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Static Rewrite Logic
      env:
        TARGET_PROXY_DOMAIN: ${{ secrets.TARGET_PROXY_DOMAIN }}
      run: python convert.py

    - name: Commit and Force Push M3U to Repository
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        
        if [ -f "live.m3u" ]; then
          git add live.m3u
          git commit -m "自动同步：静态M3U直播源已成功写入仓库" --allow-empty
          git push origin HEAD:${{ github.ref_name }}
          echo "恭喜！最新文件已成功呈现在您的仓库主页。"
        else
          echo "错误：未能生成文件"
          exit 1
        fi
