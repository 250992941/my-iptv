name: Automated IPTV Playlist Sync (Pure Python)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write # 确保有权限创建发布页面

jobs:
  sync_and_convert:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Direct Conversion Script
      env:
        SOURCE_M3U_URL: ${{ secrets.SOURCE_M3U_URL }}
        TARGET_PROXY_DOMAIN: ${{ secrets.TARGET_PROXY_DOMAIN }}
        NAIVE_NODE_URL: ${{ secrets.NAIVE_NODE_URL }}
      run: python convert.py

    # 【新增核心步骤】将生成的 live.m3u 自动发布到 GitHub 静态产物中心
    - name: Upload M3U Playlist to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: iptv-playlist
        path: live.m3u
        retention-days: 7 # 临时保存7天，每次定时任务会自动覆盖更新

    # 【更方便的国内直连法】自动生成一个永久的公开 Release 链接
    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Latest IPTV Source
        files: live.m3u
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
